# Raise the go line in go.mod when Go ships a patch release, as a pull request
# the dependency merge workflow (dependabot-merge.yml) then treats like one of
# Dependabot's own. As drafted in issue #83.
#
# Dependabot does not do this. It bumps modules, not the toolchain: in eumaeus
# it ran every week from September into October, across Go 1.26.7 and 1.26.8,
# and never touched "go 1.26.6". A Go patch release is where the standard
# library's security fixes arrive, and govulncheck in CI only notices them on
# the next pull request somebody happens to open. The go line is pinned to the
# patch so that CI, the deploy and a laptop all build with exactly one
# toolchain; this is what keeps that pin from going stale.
#
# # Why it approves CI's run on its own pull request
#
# A pull request opened with the repository's token does start CI's
# pull_request run, but GitHub holds the run at "action_required" until
# someone approves it -- its guard against a workflow starting an endless
# chain of itself. Until it runs, the pull request has no "check", which the
# ruleset on main requires, and nothing can merge it.
#
# This used to dispatch CI on the branch instead, which was the advice before
# the ruleset existed. The dispatched run passed and put a green "check" on
# the commit, but a check run from a dispatch is not one of the pull
# request's, and the ruleset reads the pull request. Go 1.26.11 (#116) was
# refused by GitHub every morning from 12 to 16 November 2026, until the
# steward pressed "Approve workflows to run" by hand.
#
# So this presses it: the same approval through the API, on the run waiting
# for it. If that is refused, the run goes red, the pull request says what a
# person must do, and dependabot-merge.yml tries the approval again each
# morning and opens its "stuck" issue after three days. The dispatch stays as
# a last resort, so that there is at least a result to look at.
#
# # What it will not do
#
# It stays on the minor the go line already names. 1.26 to 1.27 changes the
# language and is for a person to read and decide. When the named minor drops
# out of support, which is when its security fixes stop, it opens an issue
# saying so instead.
#
# # What it needs once, by hand
#
# Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests". Without it the pull request is refused; this run
# then fails, and deletes the branch it pushed so the next run tries again.

name: Go version

on:
  schedule:
    # 05:00 UTC daily, half an hour before the merge workflow, so a pull
    # request opened here has waited its full day by the next morning's merge
    # rather than the one after.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Raise the go line to the newest patch of its minor
        run: |
          set -euo pipefail

          current=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)
          [ -n "$current" ] || { echo "go.mod has no go line"; exit 1; }
          minor=$(echo "$current" | cut -d. -f1,2)

          # The download page lists the supported releases only: the newest
          # two minors, each at its newest patch.
          releases=$(curl -fsSL 'https://go.dev/dl/?mode=json' \
            | jq -r '.[] | select(.stable) | .version | ltrimstr("go")')
          latest=$(echo "$releases" | grep -E "^${minor//./\\.}\.[0-9]+$" | sort -V | tail -1 || true)

          if [ -z "$latest" ]; then
            newest=$(echo "$releases" | sort -V | tail -1)
            title="Go ${minor} is no longer supported"
            open=$(gh issue list --state open --search "\"${title}\" in:title" --json number -q '.[0].number // empty')
            if [ -n "$open" ]; then
              echo "${title}; issue #${open} already says so"
            else
              gh issue create --title "$title" --body "go.mod names Go ${current}. Go ${minor} no longer receives security fixes; the supported releases are $(echo $releases | sed 's/ /, /g'). Moving to ${newest} changes the language version, so the go line is for a person to raise, with the release notes: https://go.dev/doc/go${newest%.*}"
            fi
            exit 0
          fi

          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" = "$current" ]; then
            echo "go ${current} is the newest ${minor} release"
            exit 0
          fi

          branch="go-${latest}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "${branch} already exists; its pull request is waiting"
            exit 0
          fi

          sed -i "s/^go ${current}\$/go ${latest}/" go.mod
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c "$branch"
          git commit -q -am "Go ${latest}" -m "Raised by the Go version workflow from ${current}. Release notes: https://go.dev/doc/devel/release#go${latest}"
          git push -q origin "$branch"

          if ! gh pr create --head "$branch" --title "Go ${latest}" --body "Go ${latest} is out, and go.mod names ${current}. This raises the go line so CI, the deploy and local builds use it.

          Release notes, including which packages got security fixes: https://go.dev/doc/devel/release#go${latest}

          The workflow that opened this pull request approves CI's run on it. Once CI is green and the pull request is a day old, the merge workflow merges and deploys it like a Dependabot bump."; then
            git push -q origin --delete "$branch"
            echo "could not open the pull request. Settings -> Actions -> General ->"
            echo "\"Allow GitHub Actions to create and approve pull requests\" must be ticked."
            exit 1
          fi

          # The pull_request runs appear a few seconds after the pull request
          # does, already waiting: CI's and vuln.yml's. A minute is generous.
          # CI's is the one the ruleset needs; govulncheck's is approved too
          # so the pull request shows it, and a refusal there is not a failure.
          ci_run="" others=""
          for _ in $(seq 12); do
            sleep 5
            waiting=$(gh run list --branch "$branch" --event pull_request \
              --json databaseId,conclusion,workflowName \
              -q '.[] | select(.conclusion == "action_required") | "\(.workflowName)\t\(.databaseId)"')
            ci_run=$(printf '%s\n' "$waiting" | awk -F'\t' '$1 == "ci" { print $2; exit }')
            others=$(printf '%s\n' "$waiting" | awk -F'\t' '$1 != "ci" && $2 != "" { print $2 }')
            [ -n "$ci_run" ] && break
          done

          for id in $others; do
            gh api -X POST "repos/${GH_REPO}/actions/runs/${id}/approve" >/dev/null || echo "could not approve run ${id}"
          done

          if [ -n "$ci_run" ] && gh api -X POST "repos/${GH_REPO}/actions/runs/${ci_run}/approve" >/dev/null; then
            echo "opened the pull request for Go ${latest} and approved CI's run ${ci_run} on it"
            exit 0
          fi

          # Not found, or not allowed. A dispatched run is no use to the
          # ruleset, but it says whether the bump builds, on the commit.
          gh workflow run ci.yml --ref "$branch" || true
          gh pr comment "$branch" --body "CI's run on this pull request is waiting for approval, and the workflow that opened it could not give it${ci_run:+ (run ${ci_run})}. Until a person presses **Approve workflows to run** above, the pull request has no \`check\` and cannot be merged."
          echo "opened the pull request for Go ${latest}, but could not approve CI's run on it; said so on the pull request"
          exit 1
