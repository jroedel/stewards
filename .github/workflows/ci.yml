# Every pull request, and main. Nothing here touches the server; deploying is a
# separate workflow that arrives with deploy/, as in mass-intentions.
#
# The trigger is `pull_request`, never `pull_request_target`. This repository is
# public, so a pull request can come from anybody's fork, and
# `pull_request_target` would run that fork's code with this repository's
# token and secrets. Under `pull_request` a fork gets a read-only token and no
# secrets at all -- and this workflow needs neither.
#
# The steps are separate rather than one `make test`, so that a red run names
# which of them failed on its own line instead of making somebody read the log
# to find out.
#
# Actions are pinned to a commit rather than a tag. A tag is a moving pointer
# its owner can repoint, and a third-party action runs with access to this
# workflow's token -- so "v7" means "whatever v7 happens to be that morning".
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod, so the toolchain in CI is the one the module declares
          # and there is no second place to bump.
          go-version-file: go.mod
          cache: true

      # The Go steps are skipped while the module has no Go files. `go vet`,
      # `go test` and govulncheck all fail outright on a module with no
      # packages, and a main that is red for a known reason is one nobody reads
      # by the time the first real failure arrives. The condition turns itself
      # off with the first .go file; nothing has to be remembered.
      - name: lint
        if: hashFiles('**/*.go') != ''
        run: make lint

      - name: unit tests, with the race detector
        if: hashFiles('**/*.go') != ''
        run: make test-unit

      - name: shell tests
        run: make shell-test

      - name: vulnerability scan
        if: hashFiles('**/*.go') != ''
        run: make vuln-check

      - name: the release build is static
        # Not a duplicate of `go build`. The server has no Go toolchain and gets
        # one file, so a build that quietly links this runner's glibc is a
        # deploy that dies on the host. `make release` asserts the result is
        # statically linked.
        #
        # Skipped until cmd/stewards exists, and enforced from the commit that
        # adds it, with nothing to remember to switch on.
        if: hashFiles('cmd/stewards/*.go') != ''
        run: make release
