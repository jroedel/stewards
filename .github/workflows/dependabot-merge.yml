# Merge the dependency bumps once they have sat for a day with CI green, then
# deploy, then say so if the deploy failed. Copied from eumaeus (issue #83),
# with what differs here marked.
#
# Two kinds of pull request are merged, and nothing else:
#
#   - Dependabot's, by app/dependabot: the week's module and action bumps
#     (dependabot.yml);
#   - the Go version workflow's, by app/github-actions on a branch named
#     go-<version>: a Go patch release (go-version.yml). Dependabot does not
#     bump the go line.
#
# Dependency bumps are not a person's job. CI already decides whether a bump
# builds, tests, vets and scans clean; the deploy already gates on /healthz and
# rolls back a binary that does not answer. What was left for a person was to
# click merge, and clicking merge is not judgement. This does the click.
#
# What a person is still for is a bump this cannot merge, and the run says
# which and why in its summary page. A bump left open for three days gets an
# issue, "Dependency bumps are stuck", because the red run's email alone went
# unread for five days in November while Go 1.26.11 waited.
#
# # Why a day
#
# A day is long enough for a bad release to be yanked or followed by a fix,
# and for you to see the pull request in the list if you happened to look. It
# is not a review window: nobody is expected to review these. It is a buffer.
#
# # Why a workflow and not GitHub's auto-merge
#
# GitHub's own auto-merge waits on required status checks, and required checks
# come with branch protection, which on a private repository means a paid
# plan. This is the same behaviour with the repository's own token, for free.
#
# # Why it dispatches the deploy itself
#
# A push made with the repository's token does not trigger workflows -- GitHub
# stops there so a workflow cannot start an infinite chain of itself. So the
# merge alone would land a bump on main and never deploy it. workflow_dispatch
# is the exception to that rule, so this dispatches the deploy, waits for it,
# and fails if it failed -- and a failed scheduled workflow emails the person
# who last committed this file, which is the one email you want from any of
# this. The deploy's own rollback has already run by then.
#
# # Why its own concurrency group, unlike eumaeus
#
# eumaeus runs this in deploy.yml's group, deploy-production, so that a merge
# never races a push deploy. But this run then dispatches the deploy and
# waits for it, and the deploy joins the same group -- behind this run, which
# is waiting for it. On 2026-10-20 eumaeus merged a bump, dispatched its
# deploy, and both sat until GitHub cancelled this job at its six-hour limit;
# the deploy ran after that, and the run ended "cancelled" rather than failed,
# so nobody heard. Here the deploy keeps deploy-production to itself, which
# already queues it behind any push deploy, and this run's group only keeps
# two of these from overlapping.

name: Merge dependency bumps

on:
  schedule:
    # 05:30 UTC daily, half an hour after go-version.yml, so a Go pull
    # request opened at 05:00 has waited its day by the next morning's run.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write
  issues: write # the "Dependency bumps are stuck" issue

concurrency:
  group: dependency-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest

    # Same tripwire as deploy.yml -- APP_HOST here, where eumaeus has
    # PUBLIC_HOSTNAME: no server, nothing to deploy a bump to, and a merge
    # without a deploy would leave main ahead of production quietly.
    if: vars.APP_HOST != ''

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Merge what has waited a day and passed
        id: merge
        run: |
          set -euo pipefail

          merged=0
          failed=0
          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          stuck_cutoff=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          fields=number,title,createdAt,headRefOid,headRefName
          row='"\(.number)\t\(.createdAt)\t\(.headRefName)\t\(.headRefOid)\t\(.title)"'

          {
            gh pr list --author app/dependabot --state open --json "$fields" -q ".[] | $row"

            # Only the Go version workflow's branches: the repository's token
            # opens nothing else, but a pull request by github-actions that is
            # not a Go bump is not this workflow's to merge.
            gh pr list --author app/github-actions --state open --json "$fields" \
              -q ".[] | select(.headRefName | test(\"^go-[0-9]+\\\\.[0-9]+\\\\.[0-9]+$\")) | $row"
          } > prs.tsv

          # What each pull request came to, for the run's summary page, and
          # the ones that have waited too long, for the next step's issue.
          # stuck.md is written even when it is empty: its absence is what
          # tells the next step that this one died before it knew anything.
          : > stuck.md
          {
            echo "| Pull request | Opened | Outcome |"
            echo "| --- | --- | --- |"
          } > summary.md

          note() { # number, created, title, outcome
            printf '| #%s %s | %s | %s |\n' "$1" "$3" "${2%T*}" "$4" >> summary.md
            if [ "$2" \< "$stuck_cutoff" ]; then
              printf -- '- #%s %s (opened %s): %s\n' "$1" "$3" "${2%T*}" "$4" >> stuck.md
            fi
          }

          while IFS=$'\t' read -r number created branch sha title; do
            echo "#${number}: ${title}"

            if [ "$created" \> "$cutoff" ]; then
              echo "   opened ${created}, under a day old; waiting"
              note "$number" "$created" "$title" "under a day old; waiting"
              continue
            fi

            # The verdict is read from the pull request, as the ruleset on
            # main reads it, and not from the commit's check runs. They are
            # not the same thing. On #116 (Go 1.26.11) the commit had a green
            # "check" from the run go-version.yml dispatched, so the old
            # verdict here said green; but the pull request's own run was
            # waiting at action_required, its rollup was empty, and GitHub
            # refused the merge every morning for five days.
            #
            # mergeStateStatus is GitHub's own answer, rules included: CLEAN,
            # or UNSTABLE when only a check the ruleset does not require is
            # red -- which, today, means govulncheck. The rollup must also be
            # all success, because a state of CLEAN says nothing about a check
            # nobody made required, and the bar here has always been every
            # check, not the required ones. A check still running is "not
            # yet", and one that was skipped is not a pass.
            #
            # Except govulncheck (vuln.yml): it is red when an advisory is out
            # for any module, which says nothing about this bump, and the bump
            # that fixes the advisory is the one that must not wait behind it.
            # On 2026-11-16 that held #117 behind GO-2026-6859.
            info=$(gh pr view "$number" --json mergeStateStatus,statusCheckRollup -q '
              [.statusCheckRollup[]
                | select((.name // .context) != "govulncheck")
                | (.conclusion // .state // "") | if . == "" then "PENDING" else . end] as $c
              | (if ($c | length) == 0 then "none"
                 elif all($c[]; . == "SUCCESS") then "green"
                 else ($c | unique | join(",")) end) as $v
              | "\(.mergeStateStatus)\t\($v)"' 2>/dev/null || printf 'UNREADABLE\tunreadable')
            IFS=$'\t' read -r state verdict <<< "$info"

            # A Go version pull request is opened with this repository's
            # token, so its CI run waits at action_required until approved.
            # go-version.yml approves it as it opens the pull request; if that
            # was refused, or the run was not there yet, this tries again
            # each morning, and merges on the next run once CI has passed.
            # Only on the go-<version> branches: a waiting run anywhere else
            # is a person's to approve.
            if [[ "$branch" == go-* ]]; then
              waiting=$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${sha}&event=pull_request&status=action_required" \
                -q '.workflow_runs[].id' 2>/dev/null || true)
              if [ -n "$waiting" ]; then
                approved=0
                for id in $waiting; do
                  gh api -X POST "repos/${GH_REPO}/actions/runs/${id}/approve" >/dev/null && approved=$((approved + 1))
                done
                echo "   CI was waiting for approval; approved ${approved} of $(echo "$waiting" | wc -w) run(s)"
                note "$number" "$created" "$title" "CI was waiting for approval; approved ${approved} of $(echo "$waiting" | wc -w) run(s), so it can merge tomorrow"
                continue
              fi
            fi

            if [ "$verdict" != "green" ]; then
              echo "   checks: ${verdict}; not merging"
              note "$number" "$created" "$title" "checks: ${verdict}"
              continue
            fi

            case "$state" in
              CLEAN | UNSTABLE | HAS_HOOKS) ;;
              *)
                # BLOCKED with every check green is a rule other than the
                # checks: an approval the ruleset wants, say. BEHIND and
                # DIRTY are Dependabot's to rebase; UNKNOWN is GitHub still
                # working it out.
                echo "   checks green, but GitHub says ${state}; not merging"
                note "$number" "$created" "$title" "checks green, but GitHub says ${state}"
                continue
                ;;
            esac

            # One refused merge is that pull request's problem, not the
            # others'. This used to run under set -e with nothing around it,
            # so the first refusal ended the run and no pull request after it
            # in the list was looked at.
            echo "   a day old, ${state}, CI green: merging"
            if gh pr merge "$number" --merge --delete-branch; then
              merged=$((merged + 1))
              printf '| #%s %s | %s | merged |\n' "$number" "$title" "${created%T*}" >> summary.md
            else
              failed=$((failed + 1))
              note "$number" "$created" "$title" "GitHub refused the merge (the run's log has its words)"
            fi
          done < prs.tsv

          if [ "$(wc -l < summary.md)" -gt 2 ]; then
            { echo "### Dependency pull requests"; echo; cat summary.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No open dependency pull requests." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "merged=${merged}" >> "$GITHUB_OUTPUT"
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

      # The deploy, dispatched because the merge above cannot trigger it, and
      # watched so that a failure here is a failure of this run -- which is
      # what gets emailed. The run is found by dispatch time.
      - name: Deploy what was merged, and fail if the deploy did
        if: steps.merge.outputs.merged != '0'
        run: |
          set -euo pipefail
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy.yml --ref main

          run_id=""
          for attempt in $(seq 12); do
            sleep 5
            run_id=$(gh run list --workflow deploy.yml --event workflow_dispatch --limit 3 \
              --json databaseId,createdAt \
              -q "[.[] | select(.createdAt >= \"$since\")] | .[0].databaseId // empty")
            [ -n "$run_id" ] && break
          done

          [ -n "$run_id" ] || { echo "dispatched the deploy but cannot find its run"; exit 1; }

          # A watch that stops is not a deploy that failed. gh run watch also
          # stops when the API fails under it -- eumaeus's watch got an HTTP
          # 500 on 2026-10-13 and reported a deploy that later succeeded as
          # FAILED (jroedel/eumaeus#241) -- so the run's own conclusion is
          # what decides, and one that has none yet is watched again.
          echo "deploy run ${run_id}; waiting"
          for attempt in 1 2 3; do
            if gh run watch "$run_id" --exit-status; then
              echo "deployed"
              exit 0
            fi

            conclusion=$(gh run view "$run_id" --json conclusion -q .conclusion 2>/dev/null || true)
            case "$conclusion" in
              success)
                echo "deployed"
                exit 0
                ;;
              "")
                echo "lost sight of deploy run ${run_id} before it ended; watching again"
                sleep 30
                ;;
              *)
                echo "the deploy of the merged bump FAILED (${conclusion}); the installer rolls back on its own,"
                echo "and this run is red so that you hear about it:"
                echo "  gh run view ${run_id} --log-failed"
                exit 1
                ;;
            esac
          done

          echo "could not follow deploy run ${run_id} to its end; look at it:"
          echo "  gh run view ${run_id}"
          exit 1

      # A pull request that has waited three days gets an issue, and the issue
      # closes itself when nothing has. The run going red sends an email to
      # whoever last changed the schedule, and that was the only signal while
      # #116 sat refused from 12 to 16 November: five red runs, unread. An
      # issue reaches the GitHub app on a phone and stays in the list until it
      # is dealt with.
      #
      # One issue, found by its exact title, edited rather than duplicated.
      # Editing an issue notifies nobody, so it is commented on when the list
      # of stuck pull requests changes, and only then: a daily comment saying
      # the same thing would be the noise that gets a notification muted.
      #
      # always(), because a refused merge is one of the things it reports. If
      # the merge step died before it wrote stuck.md, this knows nothing and
      # leaves the issue as it is.
      - name: Say so in an issue when a bump has waited too long
        if: always()
        run: |
          set -euo pipefail
          [ -f stuck.md ] || { echo "the merge step wrote nothing; leaving the issue alone"; exit 0; }

          title="Dependency bumps are stuck"
          open=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            -q "[.[] | select(.title == \"${title}\")][0].number // empty")

          if [ ! -s stuck.md ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Nothing has waited more than three days now. Closed by the merge workflow."
            fi
            echo "nothing stuck"
            exit 0
          fi

          prs=$(grep -o '^- #[0-9]*' stuck.md | tr -d -- '- #' | tr '\n' ' ' | sed 's/ $//')
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="These dependency pull requests have been open for more than three days, and the merge workflow could not merge them. Each line says what stopped it on the last run.

          $(cat stuck.md)

          The usual causes, in order:
          - **checks: FAILURE** -- the bump does not build or its tests fail. It needs a person, or Dependabot's next version.
          - **checks: none** or **GitHub says BLOCKED** on a Go version pull request -- its CI run on the pull request is waiting for approval. Open the pull request and press \"Approve workflows to run\".
          - **GitHub says BEHIND/DIRTY**, or **checks: FAILURE** that main has since fixed -- comment \`@dependabot recreate\` on it. (\`@dependabot rebase\` was ignored on #117 on 2026-11-17; \`recreate\` worked.)

          Last run: ${run_url}
          This issue is kept up to date by dependabot-merge.yml and closes itself when nothing is stuck.

          <!-- stuck: ${prs} -->"
          if [ -z "$open" ]; then
            gh issue create --title "$title" --body "$body"
            exit 0
          fi

          before=$(gh issue view "$open" --json body -q .body | tr -d '\r' | sed -n 's/^<!-- stuck: \(.*\) -->$/\1/p')
          gh issue edit "$open" --body "$body"
          if [ "$before" != "$prs" ]; then
            gh issue comment "$open" --body "Now stuck: $(echo "$prs" | sed 's/[0-9][0-9]*/#&/g'). The description has why."
          fi

      # Last, so that a refused merge does not stop the deploy of the bumps
      # that did merge, nor the issue above.
      - name: Fail the run if a merge was refused
        if: always() && steps.merge.outputs.failed != '' && steps.merge.outputs.failed != '0'
        run: |
          echo "${{ steps.merge.outputs.failed }} merge(s) refused; the summary and the log above say which"
          exit 1
