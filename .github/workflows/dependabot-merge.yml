# Merge the dependency bumps once they have sat for a day with CI green, then
# deploy, then say so if the deploy failed. Copied from eumaeus (issue #83),
# with what differs here marked.
#
# Two kinds of pull request are merged, and nothing else:
#
#   - Dependabot's, by app/dependabot: the week's module and action bumps
#     (dependabot.yml);
#   - the Go version workflow's, by app/github-actions on a branch named
#     go-<version>: a Go patch release (go-version.yml). Dependabot does not
#     bump the go line.
#
# Dependency bumps are not a person's job. CI already decides whether a bump
# builds, tests, vets and scans clean; the deploy already gates on /healthz and
# rolls back a binary that does not answer. What was left for a person was to
# click merge, and clicking merge is not judgement. This does the click.
#
# # Why a day
#
# A day is long enough for a bad release to be yanked or followed by a fix,
# and for you to see the pull request in the list if you happened to look. It
# is not a review window: nobody is expected to review these. It is a buffer.
#
# # Why a workflow and not GitHub's auto-merge
#
# GitHub's own auto-merge waits on required status checks, and required checks
# come with branch protection, which on a private repository means a paid
# plan. This is the same behaviour with the repository's own token, for free.
#
# # Why it dispatches the deploy itself
#
# A push made with the repository's token does not trigger workflows -- GitHub
# stops there so a workflow cannot start an infinite chain of itself. So the
# merge alone would land a bump on main and never deploy it. workflow_dispatch
# is the exception to that rule, so this dispatches the deploy, waits for it,
# and fails if it failed -- and a failed scheduled workflow emails the person
# who last committed this file, which is the one email you want from any of
# this. The deploy's own rollback has already run by then.
#
# # Why its own concurrency group, unlike eumaeus
#
# eumaeus runs this in deploy.yml's group, deploy-production, so that a merge
# never races a push deploy. But this run then dispatches the deploy and
# waits for it, and the deploy joins the same group -- behind this run, which
# is waiting for it. On 2026-10-20 eumaeus merged a bump, dispatched its
# deploy, and both sat until GitHub cancelled this job at its six-hour limit;
# the deploy ran after that, and the run ended "cancelled" rather than failed,
# so nobody heard. Here the deploy keeps deploy-production to itself, which
# already queues it behind any push deploy, and this run's group only keeps
# two of these from overlapping.

name: Merge dependency bumps

on:
  schedule:
    # 05:30 UTC daily, half an hour after go-version.yml, so a Go pull
    # request opened at 05:00 has waited its day by the next morning's run.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: dependency-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest

    # Same tripwire as deploy.yml -- APP_HOST here, where eumaeus has
    # PUBLIC_HOSTNAME: no server, nothing to deploy a bump to, and a merge
    # without a deploy would leave main ahead of production quietly.
    if: vars.APP_HOST != ''

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Merge what has waited a day and passed
        id: merge
        run: |
          set -euo pipefail

          merged=0
          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          fields=number,title,createdAt,mergeable,headRefOid,headRefName
          row='"\(.number)\t\(.createdAt)\t\(.mergeable)\t\(.headRefOid)\t\(.title)"'

          {
            gh pr list --author app/dependabot --state open --json "$fields" -q ".[] | $row"

            # Only the Go version workflow's branches: the repository's token
            # opens nothing else, but a pull request by github-actions that is
            # not a Go bump is not this workflow's to merge.
            gh pr list --author app/github-actions --state open --json "$fields" \
              -q ".[] | select(.headRefName | test(\"^go-[0-9]+\\\\.[0-9]+\\\\.[0-9]+$\")) | $row"
          } > prs.tsv

          if [ ! -s prs.tsv ]; then
            echo "no open dependency pull requests"
            echo "merged=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS=$'\t' read -r number created mergeable sha title; do
            echo "#${number}: ${title}"

            if [ "$created" \> "$cutoff" ]; then
              echo "   opened ${created}, under a day old; waiting"
              continue
            fi

            if [ "$mergeable" != "MERGEABLE" ]; then
              echo "   ${mergeable}; Dependabot rebases its own, so next time"
              continue
            fi

            # Every check run on the head commit must have concluded, and
            # concluded success. A check still running is "not yet", not
            # "passed"; a check that was skipped is not a pass either.
            verdict=$(gh api "repos/${GH_REPO}/commits/${sha}/check-runs" \
              -q '[.check_runs[] | .conclusion // "pending"] | if length == 0 then "none" elif all(. == "success") then "green" else join(",") end' \
              2>/dev/null || echo "unreadable")

            if [ "$verdict" != "green" ]; then
              echo "   checks: ${verdict}; not merging"
              continue
            fi

            echo "   a day old, mergeable, CI green: merging"
            gh pr merge "$number" --merge --delete-branch
            merged=$((merged + 1))
          done < prs.tsv

          echo "merged=${merged}" >> "$GITHUB_OUTPUT"

      # The deploy, dispatched because the merge above cannot trigger it, and
      # watched so that a failure here is a failure of this run -- which is
      # what gets emailed. The run is found by dispatch time.
      - name: Deploy what was merged, and fail if the deploy did
        if: steps.merge.outputs.merged != '0'
        run: |
          set -euo pipefail
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy.yml --ref main

          run_id=""
          for attempt in $(seq 12); do
            sleep 5
            run_id=$(gh run list --workflow deploy.yml --event workflow_dispatch --limit 3 \
              --json databaseId,createdAt \
              -q "[.[] | select(.createdAt >= \"$since\")] | .[0].databaseId // empty")
            [ -n "$run_id" ] && break
          done

          [ -n "$run_id" ] || { echo "dispatched the deploy but cannot find its run"; exit 1; }

          # A watch that stops is not a deploy that failed. gh run watch also
          # stops when the API fails under it -- eumaeus's watch got an HTTP
          # 500 on 2026-10-13 and reported a deploy that later succeeded as
          # FAILED (jroedel/eumaeus#241) -- so the run's own conclusion is
          # what decides, and one that has none yet is watched again.
          echo "deploy run ${run_id}; waiting"
          for attempt in 1 2 3; do
            if gh run watch "$run_id" --exit-status; then
              echo "deployed"
              exit 0
            fi

            conclusion=$(gh run view "$run_id" --json conclusion -q .conclusion 2>/dev/null || true)
            case "$conclusion" in
              success)
                echo "deployed"
                exit 0
                ;;
              "")
                echo "lost sight of deploy run ${run_id} before it ended; watching again"
                sleep 30
                ;;
              *)
                echo "the deploy of the merged bump FAILED (${conclusion}); the installer rolls back on its own,"
                echo "and this run is red so that you hear about it:"
                echo "  gh run view ${run_id} --log-failed"
                exit 1
                ;;
            esac
          done

          echo "could not follow deploy run ${run_id} to its end; look at it:"
          echo "  gh run view ${run_id}"
          exit 1
