# Dependabot, for the two kinds of pin this repository holds.
#
# The actions are pinned by commit (see the comment in ci.yml), which is only
# sustainable if something proposes the bumps: Dependabot opens a pull request
# when a new release exists, moves the SHA and the version comment together,
# and CI runs on it before anyone merges. Weekly, on a Monday, so a bump lands
# as one review at the start of a week rather than as noise through it.
#
# Go modules the same way. govulncheck in CI already fails on a reachable
# vulnerability; this is what turns that red build into a green pull request
# with the fix in it.
#
# Copied from eumaeus (issue #83). Neither ecosystem covers the go line in
# go.mod -- Dependabot bumps modules, not the toolchain -- which is what
# go-version.yml is for. dependabot-merge.yml merges both kinds after a day.
#
# One pull request per ecosystem per week, not one per module. The first week
# opened three Go bumps at once, and merging the first put the other two into
# conflict on the same lines of go.mod -- which Dependabot repairs by rebasing,
# but only after somebody has stared at a conflict editor wondering whether to
# click "accept both". Grouped, the week's bumps arrive together, CI runs once,
# and there is nothing to conflict with.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Bump"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: "Bump"
