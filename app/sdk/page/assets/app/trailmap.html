  steward sets is a point in it. Redrawing this moves every spot already
  set, which is the reason to change it only as a whole and on purpose.

  What is different from the public map, and why:

  - The stations are small dots on the line rather than numbered links.
    Here a station's space is a place like any other, with a marker of its
    own once a steward has put it on the map; a second, numbered circle
    under it would be two numbers for one spot. The dots stay as landmarks,
    which is what a steward needs when tapping where a place is.

    and they say where the trail begins better than a word does.
