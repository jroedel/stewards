{{define "title"}}A photo, closer · Garden stewards{{end}}
{{define "content"}}{{with .Data}}
<div lang="en">
<p class="eyebrow"><a href="/steward/inbox/{{.ID}}">Sort this photo</a></p>
<h1>Closer</h1>

<figure class="zoom">
  <div class="zoom-frame">
    <img src="/steward/inbox/{{.ID}}/large.jpg" width="{{.LargeW}}" height="{{.LargeH}}" alt="">
    <img class="zoom-full" src="/steward/inbox/{{.ID}}/{{.Full}}" width="{{.LargeW}}" height="{{.LargeH}}" alt="The photo being sorted, at full size">
  </div>
</figure>
<p class="help">Pinch to zoom in.</p>
<a class="onward" href="/steward/inbox/{{.ID}}/{{.Full}}"><span>Open the photo by itself</span><span aria-hidden="true">›</span></a>
<a class="onward" href="/steward/inbox/{{.ID}}"><span>Back to sorting it</span><span aria-hidden="true">›</span></a>
</div>
{{end}}{{end}}
